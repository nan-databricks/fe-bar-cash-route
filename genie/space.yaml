# SNB Cash Ops Assistant — Genie Agent (formerly Genie space).
# Deployed by 01_deploy_genie.py (idempotent: find-or-create by title).
# {S} is replaced with catalog.schema. IDs are content hashes so redeploys stay stable.
title: "SNB Cash Ops Assistant"
description: >-
  Cash operations assistant for Siam Northeast Bank (SNB) in Khon Kaen: node cash-out
  risk, idle cash by depot, CIT cost and van usage. Reads gold tables in
  stable_classic_nan_fe_vm_catalog.snb_cash_ops. Synthetic demo data.
warehouse_id: "23189fee7d892fb8"
schema: stable_classic_nan_fe_vm_catalog.snb_cash_ops

tables:
  gold_cash_nodes: "One row per servable node (BRANCH, ATM, RCM): identity, depot, capacity, hours."
  gold_node_daily: "Daily unified cash flow per node. net_outflow_thb is cash leaving the node. History 2025-04-01 to 2026-09-30."
  gold_demand_features: "Training/scoring features (lags, rolling means, calendar flags) plus label net_outflow_thb."
  gold_node_status: "Latest snapshot per node. as_of_date is 2026-09-30. current_cash_thb and avg_daily_outflow_28d drive days-to-cash-out."
  gold_baseline_daily: "Historical fixed-cycle CIT plan KPIs per depot and service_date (vehicles_used, stops, km, cost_thb)."
  gold_demand_forecast: "ML 7-day net-outflow forecast from 2026-10-01 (horizon_day 1..7). Optional until ML job lands."
  gold_replenishment_orders: "Nodes needing a visit on service_date with action DELIVER|PICKUP, days_to_cashout, priority CRITICAL|HIGH|NORMAL."
  gold_routes: "CIT routes for OPTIMIZED vs BASELINE plan_type on service_date (usually 2026-10-01)."
  gold_route_stops: "Ordered stops on each route with ETA, action, amount_thb."
  gold_route_summary: "Day-level KPIs by plan_type: cost_thb, vehicles_used, idle_cash_thb, cashout_risk_nodes, sla_pct."
  gold_model_metrics: "Forecast quality (MAPE/WAPE) by model_version and segment (node_type)."

value_columns:
  gold_cash_nodes: [node_type, district, depot_id]
  gold_node_status: [node_type, district, depot_id]
  gold_replenishment_orders: [node_type, depot_id, action, priority]
  gold_routes: [plan_type, depot_id]
  gold_route_summary: [plan_type]

sample_questions:
  - "Which nodes run out of cash in the next 3 days if we do nothing?"
  - "What is CIT cost of optimized vs baseline for 2026-10-01?"
  - "How much idle cash is sitting in each depot as of 2026-09-30?"
  - "How many vans were used on the last baseline day versus the optimized plan?"
  - "Which districts have the highest cash-out risk?"
  - "Show forecast WAPE by node type"

instructions: |
  You are the SNB Cash Ops Assistant for Siam Northeast Bank (fictional), Khon Kaen province.
  Audience: cash-ops dispatchers, CIT planners, and the CFO. Answer in concise business English.
  Currency is Thai baht (THB). Never use a real bank name. Never invent nodes, costs, or van counts.

  ## Grain and dates
  - Node snapshot as_of_date = 2026-09-30 (gold_node_status).
  - History window = 2025-04-01 to 2026-09-30 (gold_node_daily, gold_baseline_daily).
  - Optimized CIT plan_date / service_date = 2026-10-01 when ML route tables exist.
  - Always state the date and grain in the answer (per node, per depot, per plan_type, per day).

  ## Which table to use
  - Cash-out / run-out / days of cash left: prefer gold_replenishment_orders.days_to_cashout and priority
    when that table exists. If it does not exist, approximate from gold_node_status:
    days_to_cashout = current_cash_thb / NULLIF(avg_daily_outflow_28d, 0)
    and treat avg_daily_outflow_28d <= 0 as "not draining" (exclude from cash-out lists).
  - Node master / names / coords: gold_cash_nodes. Join to facts on node_id.
  - Daily history / payday spikes: gold_node_daily (join gold_demand_features on node_id, txn_date for calendar flags).
  - Idle cash by depot: SUM(current_cash_thb) on gold_node_status grouped by depot_id (join gold_cash_nodes for names).
  - Historical CIT cost and vans: gold_baseline_daily (fixed-cycle plan). Last history day is 2026-09-30.
  - Optimized vs baseline CIT for 2026-10-01: gold_route_summary (plan_type OPTIMIZED vs BASELINE).
    If gold_route_summary is missing, say the ML route job has not landed yet and fall back to gold_baseline_daily
    for the historical cycle only — do not invent an optimized cost.
  - Van / vehicle counts for the optimized day: gold_route_summary.vehicles_used or COUNT(DISTINCT vehicle_id) on gold_routes.
  - Forecast quality: gold_model_metrics. metric values are WAPE_model, WAPE_naive, MAPE_model, MAPE_naive,
    P80_coverage; segment is ATM | BRANCH | RCM | ALL. "WAPE" means WAPE_model; compare against WAPE_naive (lag-7 naive).
  - Do not query bronze or silver tables. Gold only.

  ## Agent mode / skills
  Use Agent mode for multi-step ops questions. Match the question to one skill and follow its output shape:
  - cash-out-risk: nodes that cash out within N days (default 3).
  - cit-cost-compare: OPTIMIZED vs BASELINE cost, km, vans, SLA, idle cash.
  - idle-cash-by-depot: current_cash_thb rolled to depot.
  - vans-used: vehicles_used for a date and plan.
  One trusted SQL per skill when Chat mode is used; Agent mode may run the skill SQL then a short narrative.

  ## Style
  Summarize the number first, then a short table. Round THB to the nearest thousand for exec answers unless asked for exact.
  Cite filters (service_date, plan_type, depot_id). If a gold ML table is absent, say so in one sentence and use the pipeline fallback.

joins:
  - left: {identifier: "{S}.gold_node_daily", alias: gold_node_daily}
    right: {identifier: "{S}.gold_cash_nodes", alias: gold_cash_nodes}
    sql: "`gold_node_daily`.`node_id` = `gold_cash_nodes`.`node_id`"
    rel: FROM_RELATIONSHIP_TYPE_MANY_TO_ONE
  - left: {identifier: "{S}.gold_node_status", alias: gold_node_status}
    right: {identifier: "{S}.gold_cash_nodes", alias: gold_cash_nodes}
    sql: "`gold_node_status`.`node_id` = `gold_cash_nodes`.`node_id`"
    rel: FROM_RELATIONSHIP_TYPE_ONE_TO_ONE
  - left: {identifier: "{S}.gold_demand_features", alias: gold_demand_features}
    right: {identifier: "{S}.gold_cash_nodes", alias: gold_cash_nodes}
    sql: "`gold_demand_features`.`node_id` = `gold_cash_nodes`.`node_id`"
    rel: FROM_RELATIONSHIP_TYPE_MANY_TO_ONE
  - left: {identifier: "{S}.gold_demand_forecast", alias: gold_demand_forecast}
    right: {identifier: "{S}.gold_cash_nodes", alias: gold_cash_nodes}
    sql: "`gold_demand_forecast`.`node_id` = `gold_cash_nodes`.`node_id`"
    rel: FROM_RELATIONSHIP_TYPE_MANY_TO_ONE
  - left: {identifier: "{S}.gold_replenishment_orders", alias: gold_replenishment_orders}
    right: {identifier: "{S}.gold_cash_nodes", alias: gold_cash_nodes}
    sql: "`gold_replenishment_orders`.`node_id` = `gold_cash_nodes`.`node_id`"
    rel: FROM_RELATIONSHIP_TYPE_MANY_TO_ONE
  - left: {identifier: "{S}.gold_route_stops", alias: gold_route_stops}
    right: {identifier: "{S}.gold_routes", alias: gold_routes}
    sql: "`gold_route_stops`.`service_date` = `gold_routes`.`service_date` AND `gold_route_stops`.`plan_type` = `gold_routes`.`plan_type` AND `gold_route_stops`.`route_id` = `gold_routes`.`route_id`"
    rel: FROM_RELATIONSHIP_TYPE_MANY_TO_ONE
  - left: {identifier: "{S}.gold_routes", alias: gold_routes}
    right: {identifier: "{S}.gold_route_summary", alias: gold_route_summary}
    sql: "`gold_routes`.`service_date` = `gold_route_summary`.`service_date` AND `gold_routes`.`plan_type` = `gold_route_summary`.`plan_type`"
    rel: FROM_RELATIONSHIP_TYPE_MANY_TO_ONE

examples:
  - question: "Which nodes run out of cash in the next 3 days if we do nothing?"
    usage: "Cash-out risk. Prefer replenishment_orders; fallback divides current cash by 28-day average outflow."
    sql: |
      SELECT
        s.node_id,
        n.node_type,
        n.node_name,
        s.depot_id,
        s.current_cash_thb,
        s.avg_daily_outflow_28d,
        s.current_cash_thb / NULLIF(s.avg_daily_outflow_28d, 0) AS days_to_cashout
      FROM {S}.gold_node_status s
      JOIN {S}.gold_cash_nodes n ON s.node_id = n.node_id
      WHERE s.avg_daily_outflow_28d > 0
        AND s.current_cash_thb / s.avg_daily_outflow_28d <= 3
      ORDER BY days_to_cashout ASC
      LIMIT 25
  - question: "Which nodes cash out in 3 days using replenishment orders?"
    usage: "Use when gold_replenishment_orders exists. Plan date 2026-10-01."
    sql: |
      SELECT node_id, node_type, node_name, depot_id, days_to_cashout, priority, action, amount_thb
      FROM {S}.gold_replenishment_orders
      WHERE service_date = DATE '2026-10-01'
        AND days_to_cashout <= 3
      ORDER BY days_to_cashout ASC, priority
  - question: "What is CIT cost of optimized vs baseline for 2026-10-01?"
    usage: "Day-level plan comparison. Requires gold_route_summary."
    sql: |
      SELECT plan_type, routes, vehicles_used, stops, km, duration_hr, cost_thb,
             idle_cash_thb, cashout_risk_nodes, sla_pct
      FROM {S}.gold_route_summary
      WHERE service_date = DATE '2026-10-01'
      ORDER BY plan_type
  - question: "How much idle cash is sitting in each depot as of 2026-09-30?"
    usage: "Idle cassette/vault cash from the snapshot, not in-transit CIT."
    sql: |
      SELECT
        s.depot_id,
        COUNT(*) AS nodes,
        SUM(s.current_cash_thb) AS idle_cash_thb
      FROM {S}.gold_node_status s
      WHERE s.as_of_date = DATE '2026-09-30'
      GROUP BY s.depot_id
      ORDER BY s.depot_id
  - question: "How many vans were used on the last baseline day versus the optimized plan?"
    usage: "Baseline vans from gold_baseline_daily on 2026-09-30; optimized vans from gold_route_summary on 2026-10-01."
    sql: |
      SELECT 'BASELINE' AS plan_type, DATE '2026-09-30' AS service_date,
             SUM(vehicles_used) AS vehicles_used, SUM(cost_thb) AS cost_thb
      FROM {S}.gold_baseline_daily
      WHERE service_date = DATE '2026-09-30'
      UNION ALL
      SELECT plan_type, service_date, vehicles_used, cost_thb
      FROM {S}.gold_route_summary
      WHERE service_date = DATE '2026-10-01' AND plan_type = 'OPTIMIZED'
  - question: "Which districts have the highest cash-out risk?"
    usage: "District rollup of nodes with <= 3 days of cash."
    sql: |
      SELECT
        n.district,
        COUNT(*) AS at_risk_nodes,
        SUM(s.current_cash_thb) AS cash_thb
      FROM {S}.gold_node_status s
      JOIN {S}.gold_cash_nodes n ON s.node_id = n.node_id
      WHERE s.avg_daily_outflow_28d > 0
        AND s.current_cash_thb / s.avg_daily_outflow_28d <= 3
      GROUP BY n.district
      ORDER BY at_risk_nodes DESC

  - question: "Show forecast WAPE by node type"
    usage: "Model vs lag-7 naive WAPE per segment from gold_model_metrics."
    sql: |
      SELECT
        segment AS node_type,
        MAX(CASE WHEN metric = 'WAPE_model' THEN value END) AS wape_model,
        MAX(CASE WHEN metric = 'WAPE_naive' THEN value END) AS wape_naive
      FROM {S}.gold_model_metrics
      WHERE metric IN ('WAPE_model', 'WAPE_naive')
      GROUP BY segment
      ORDER BY segment

sql_snippets:
  measures:
    - name: Idle cash THB
      sql: "SUM(`{S}`.`gold_node_status`.`current_cash_thb`) AS idle_cash_thb"
      synonyms: [idle cash, cassette cash, vault cash]
    - name: CIT cost THB
      sql: "SUM(`{S}`.`gold_baseline_daily`.`cost_thb`) AS cit_cost_thb"
      synonyms: [cit cost, trip cost]
  expressions:
    - name: Days to cash-out
      sql: "`{S}`.`gold_node_status`.`current_cash_thb` / NULLIF(`{S}`.`gold_node_status`.`avg_daily_outflow_28d`, 0) AS days_to_cashout"
      synonyms: [days of cash, run-out days, cash-out horizon]
  filters:
    - name: Cash-out within 3 days
      sql: "`{S}`.`gold_node_status`.`avg_daily_outflow_28d` > 0 AND `{S}`.`gold_node_status`.`current_cash_thb` / `{S}`.`gold_node_status`.`avg_daily_outflow_28d` <= 3"
      synonyms: [cash out in 3 days, run out soon]
    - name: Plan date 1 Oct 2026
      sql: "`service_date` = DATE '2026-10-01'"
      synonyms: [plan date, tomorrow plan, "2026-10-01"]

benchmarks:
  - q: ["Which nodes run out of cash in the next 3 days if we do nothing?"]
    sql: |
      SELECT s.node_id, n.node_name, s.depot_id,
             s.current_cash_thb / NULLIF(s.avg_daily_outflow_28d, 0) AS days_to_cashout
      FROM {S}.gold_node_status s
      JOIN {S}.gold_cash_nodes n ON s.node_id = n.node_id
      WHERE s.avg_daily_outflow_28d > 0
        AND s.current_cash_thb / s.avg_daily_outflow_28d <= 3
      ORDER BY days_to_cashout
  - q: ["How much idle cash is sitting in each depot as of 2026-09-30?"]
    sql: |
      SELECT depot_id, SUM(current_cash_thb) AS idle_cash_thb
      FROM {S}.gold_node_status
      WHERE as_of_date = DATE '2026-09-30'
      GROUP BY depot_id
  - q: ["How many vans did the fixed-cycle plan use on 2026-09-30?"]
    sql: |
      SELECT SUM(vehicles_used) AS vehicles_used, SUM(cost_thb) AS cost_thb
      FROM {S}.gold_baseline_daily
      WHERE service_date = DATE '2026-09-30'
